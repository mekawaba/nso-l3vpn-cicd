name: NSO L3VPN CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nso-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NSO_IMAGE: ${{ vars.NSO_IMAGE || 'cisco-nso-prod:6.7' }}
  NSO_NED_TARBALL: ${{ vars.NSO_NED_TARBALL }}
  NSO_CI_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  preflight:
    name: preflight
    # Secrets and the self-hosted runner must never be exposed to fork PRs.
    # Every other job depends on this one, so it gates the whole run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, nso]
    timeout-minutes: 5
    steps:
      - name: 必要な設定 (Secrets / Variables / NSO イメージ) の確認
        env:
          HAS_NETSIM_USERNAME: ${{ secrets.NETSIM_USERNAME != '' }}
          HAS_NETSIM_PASSWORD: ${{ secrets.NETSIM_PASSWORD != '' }}
          HAS_CIRCUIT_CLIENT_ID: ${{ secrets.CIRCUIT_CLIENT_ID != '' }}
          HAS_CIRCUIT_CLIENT_SECRET: ${{ secrets.CIRCUIT_CLIENT_SECRET != '' }}
          HAS_CIRCUIT_APP_KEY: ${{ secrets.CIRCUIT_APP_KEY != '' }}
        run: |
          ok=true
          [ -n "$NSO_NED_TARBALL" ] || { echo "::error::Repository variable NSO_NED_TARBALL is not set"; ok=false; }
          [ -z "$NSO_NED_TARBALL" ] || [ -f "$NSO_NED_TARBALL" ] || { echo "::error::NED tarball not found on runner: $NSO_NED_TARBALL"; ok=false; }
          for s in NETSIM_USERNAME NETSIM_PASSWORD CIRCUIT_CLIENT_ID CIRCUIT_CLIENT_SECRET CIRCUIT_APP_KEY; do
            v="HAS_$s"; [ "${!v}" = "true" ] || { echo "::error::Repository secret $s is not set"; ok=false; }
          done
          docker image inspect "$NSO_IMAGE" --format '{{.RepoTags}} {{.Created}}' || { echo "::error::Docker image $NSO_IMAGE not found on runner"; ok=false; }
          $ok

  unit-test:
    name: unit-test
    needs: preflight
    runs-on: [self-hosted, linux, nso]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python unittest
        run: python3 -m unittest discover -s tests/unit -v

  build:
    name: build
    needs: preflight
    runs-on: [self-hosted, linux, nso]
    timeout-minutes: 10
    outputs:
      artifact: l3vpn-package-${{ github.run_id }}-${{ github.run_attempt }}
      tarball: ${{ steps.build.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: サービスパッケージのビルド (NSO コンテナ内で make)
        id: build
        run: |
          tarball=$(ci/build_package.sh packages/l3vpn "$HOME/nso-ci-work/$NSO_CI_ID-build" dist | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$tarball")" >> "$GITHUB_OUTPUT"
          echo "### build: \`$(basename "$tarball")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: ビルド済みパッケージのアップロード (後続ジョブ用)
        uses: actions/upload-artifact@v4
        with:
          name: l3vpn-package-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: ${{ steps.build.outputs.tarball }}
          retention-days: 1

  test:
    name: test (NSO 6.7 / netsim / Robot)
    needs: build
    runs-on: [self-hosted, linux, nso]
    timeout-minutes: 30
    env:
      NETSIM_USERNAME: ${{ secrets.NETSIM_USERNAME }}
      NETSIM_PASSWORD: ${{ secrets.NETSIM_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 環境の準備
        uses: ./.github/actions/python-env

      - name: ビルド済みパッケージのダウンロード
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}-build
          path: dist/

      - name: Robot Framework テスト (NSO 起動 〜 show run 確認)
        run: |
          export NSO_CI_WORKDIR="$HOME/nso-ci-work/$NSO_CI_ID"
          robot --outputdir artifacts/robot --exitonfailure \
                --variable ARTIFACTS_DIR:${{ github.workspace }}/artifacts \
                --variable PACKAGE_TARBALL:${{ github.workspace }}/dist/${{ needs.build.outputs.tarball }} \
                tests/robot/l3vpn_ci.robot

      - name: テスト結果のアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nso-ci-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14

  llm-review:
    name: llm-review (Cisco Circuit)
    needs: test
    runs-on: [self-hosted, linux, nso]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 環境の準備
        uses: ./.github/actions/python-env

      - name: テスト結果のダウンロード
        uses: actions/download-artifact@v4
        with:
          name: nso-ci-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: LLM レビュー
        env:
          CIRCUIT_CLIENT_ID: ${{ secrets.CIRCUIT_CLIENT_ID }}
          CIRCUIT_CLIENT_SECRET: ${{ secrets.CIRCUIT_CLIENT_SECRET }}
          CIRCUIT_APP_KEY: ${{ secrets.CIRCUIT_APP_KEY }}
          CIRCUIT_MODEL: ${{ vars.CIRCUIT_MODEL }}
        run: |
          python ci/llm_review.py \
            --package-dir packages/l3vpn \
            --params tests/params/service_params.yaml \
            --artifacts-dir artifacts \
            --output artifacts/llm_review.md

      - name: PR にレビュー結果をコメント
        if: always() && github.event_name == 'pull_request' && hashFiles('artifacts/llm_review.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('artifacts/llm_review.md', 'utf8');
            const marker = '<!-- nso-llm-review -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: レビュー結果のアップロード
        if: always() && hashFiles('artifacts/llm_review.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: llm-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/llm_review.md
          retention-days: 14

  deliver-package:
    name: deliver-package
    # Only a package that passed both the Robot tests and the LLM review is delivered.
    needs: [unit-test, build, llm-review]
    runs-on: [self-hosted, linux, nso]
    timeout-minutes: 5
    steps:
      - name: ビルド済みパッケージのダウンロード
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}-build
          path: dist/

      - name: レビュー済みパッケージのアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist/*.tar.gz
          retention-days: 14

  cleanup:
    name: cleanup
    if: always() && needs.preflight.result != 'skipped'
    needs: [preflight, unit-test, build, test, llm-review, deliver-package]
    runs-on: [self-hosted, linux, nso]
    timeout-minutes: 5
    steps:
      - name: 後片付け (コンテナ・作業ディレクトリ削除)
        run: |
          docker ps -aq --filter "name=nso-ci-${NSO_CI_ID}-" | xargs -r docker rm -f
          docker network ls -q --filter "name=nso-ci-${NSO_CI_ID}-" | xargs -r docker network rm
          for dir in "$HOME/nso-ci-work/$NSO_CI_ID" "$HOME/nso-ci-work/$NSO_CI_ID-build"; do
            if [ -d "$dir" ]; then
              docker run --rm -u root -v "$dir:/w" --entrypoint sh "$NSO_IMAGE" -c 'rm -rf /w/* /w/.[!.]*'
              rm -rf "$dir"
            fi
          done
